plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "de.loicezt.stickers"
    compileSdk 36
    // Use Flutter's NDK version to stay compatible with AGP 9 defaults.
    // If you need a specific NDK, set it via flutter.ndkVersion or override here.
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "de.loicezt.stickers"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        // A stable, intentionally public debug key lets every GitHub Actions
        // debug APK update the previous one. Never use this key for production.
        debug {
            storeFile = file("debug-signing.p12")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
            storeType = "PKCS12"
        }

        // Only set up release signing when android/key.properties exists — it is
        // gitignored, so a fresh clone has none and `flutter build apk --release`
        // would otherwise fail while configuring the project.
        if (keystorePropertiesFile.exists()) {
            create("release") {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                def storeFilePath = keystoreProperties["storeFile"]
                def store = new File(storeFilePath)
                // Relative storeFile paths are resolved against the project root,
                // not the daemon's working directory.
                storeFile = store.isAbsolute() ? store : rootProject.file(storeFilePath)
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else if (providers.gradleProperty("communitySigning").orNull == "true") {
                // Explicit opt-in for GitHub community builds only. Retains
                // update compatibility with the already distributed debug APK.
                signingConfig signingConfigs.debug
            } else {
                logger.warn("android/key.properties not found: building an unsigned release APK. " +
                    "Add a keystore to sign release builds for publishing.")
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

// Use Java 17 toolchain for Kotlin compilation – eliminates
// \"source value 8 is obsolete\" warnings and matches AGP 9 / JDK 17.
kotlin {
    jvmToolchain(17)
}

flutter {
    source '../..'
}

dependencies {}
