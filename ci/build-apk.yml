# Builds the Android APK(s) and uploads them as workflow artifacts.
#
# On a fork, enable Actions once via Settings -> Actions -> General -> Allow all actions,
# then every push (and a manual "Run workflow") produces downloadable APKs.
# The APKs are signed with a throwaway CI key — fine for sideloading/testing, not for Play.

name: Build APK

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install pinned Android NDK / CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;29.0.14206865" "cmake;3.22.1" || true
          fi

      - name: Create throwaway release signing key
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/ci-release.jks" \
            -alias ci -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass android -keypass android -dname "CN=CI,O=none,C=US"
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=ci
          storeFile=$GITHUB_WORKSPACE/ci-release.jks
          EOF

      - run: flutter pub get
      - name: Analyze (report only, do not fail the build)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: stickers-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
