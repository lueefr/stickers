name: Build and publish debug APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part to bump (auto = patch, rolling 9 over to the next minor)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: 'Explicit version name, e.g. 2.0.0 (overrides bump; must be newer)'
        type: string
        default: ''

# Publishing a GitHub Release requires write access to repository contents.
permissions:
  contents: write

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and publish
    runs-on: ubuntu-latest
    # Defense in depth: the version-bump commit pushed below (tagged [skip ci])
    # must never trigger another release run. Pushes made with GITHUB_TOKEN
    # already don't trigger workflows; this guard covers custom tokens too.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          pubspec=$(python3 tool/bump_version.py --pubspec)
          echo "pubspec.yaml: $pubspec"

          if [[ "$EVENT" == "pull_request" ]]; then
            # PR builds only validate the code; the version is assigned when
            # the change lands on main.
            next="$pubspec"
            bumped=false
          else
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [[ -n "$latest" ]] && python3 tool/bump_version.py --check "$latest"; then
              echo "latest release: $latest"
              base=$(python3 tool/bump_version.py --max "$pubspec" "$latest")
            else
              echo "no parseable previous release; basing the bump on pubspec.yaml"
              base="$pubspec"
            fi
            echo "base version: $base"

            args=(--plan --base "$base")
            [[ -n "$BUMP" ]] && args+=(--bump "$BUMP")
            [[ -n "$EXPLICIT" ]] && args+=(--explicit "$EXPLICIT")
            next=$(python3 tool/bump_version.py "${args[@]}")

            # A re-run must not reuse a tag: keep advancing while it exists.
            attempts=0
            while gh release view "v$next" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
              attempts=$((attempts + 1))
              if [[ "$attempts" -ge 50 ]]; then
                echo "::error::could not find a free release tag after 50 attempts"
                exit 1
              fi
              echo "tag v$next already exists; advancing once more"
              next=$(python3 tool/bump_version.py --next "$next")
            done

            python3 tool/bump_version.py --set-pubspec "$next"
            bumped=true
          fi

          name="${next%%+*}"
          build="${next##*+}"
          {
            echo "full=$next"
            echo "name=$name"
            echo "build=$build"
            echo "tag=v$next"
            echo "safe=${next//+/-}"
            echo "bumped=$bumped"
          } >> "$GITHUB_OUTPUT"
          echo "building version: $next (bumped: $bumped)"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        id: analyze
        # The tree is currently lint clean, but warnings and infos stay
        # non-fatal so a new lint introduced by a Flutter upgrade cannot block
        # a release build. Analyzer errors stay fatal, and the APK build below
        # compiles every source file as well.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          {
            echo '### Flutter analyze output'
            echo
            echo '```text'
            cat analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload analyzer diagnostics
        if: steps.analyze.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: flutter-analyze-diagnostics-${{ github.run_id }}
          path: analyze.log
          if-no-files-found: error
          retention-days: 7

      - name: Surface analyzer diagnostics
        if: steps.analyze.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The runner log is also uploaded above. Echo the first diagnostics
          # as annotations so they remain inspectable when a log download is
          # unavailable from a restricted network.
          for number, line in enumerate(Path('analyze.log').read_text().splitlines(), 1):
              if not line.strip():
                  continue
              message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error file=analyze.log,line={number}::{message}')
              if number >= 100:
                  break
          PY

      - name: Fail on analyzer errors
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: flutter test

      - name: Build signed debug APK
        shell: bash
        env:
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          args=(
            --debug
            --build-name "$VERSION_NAME"
            --build-number "$BUILD_NUMBER"
          )
          if [[ -n "$GOOGLE_FONTS_API_KEY" ]]; then
            args+=(--dart-define="GOOGLE_FONTS_API_KEY=$GOOGLE_FONTS_API_KEY")
          fi
          flutter build apk "${args[@]}"

      - name: Prepare APK
        id: apk
        shell: bash
        env:
          SAFE_VERSION: ${{ steps.version.outputs.safe }}
        run: |
          apk="build/app/outputs/flutter-apk/stickers-${SAFE_VERSION}-debug.apk"
          mv build/app/outputs/flutter-apk/app-debug.apk "$apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$hash" "$(basename "$apk")" > "${apk}.sha256"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "checksum=${apk}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: stickers-${{ steps.version.outputs.safe }}-debug
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit version bump
        id: bump_commit
        if: github.event_name != 'pull_request' && steps.version.outputs.bumped == 'true'
        shell: bash
        env:
          FULL_VERSION: ${{ steps.version.outputs.full }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          if git diff --cached --quiet; then
            echo "pubspec.yaml already up to date; nothing to commit"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: bump version to $FULL_VERSION [skip ci]"
          branch="${GITHUB_REF_NAME:?}"
          git fetch origin "$branch"
          # Flutter tooling can leave tracked generated files modified after
          # the version commit. Autostash those changes so a concurrent push
          # can still be rebased without failing with "cannot rebase: You
          # have unstaged changes".
          if ! git rebase --autostash "origin/$branch"; then
            git rebase --abort
            echo "::warning::could not rebase the version bump onto the latest $branch; the release below still goes ahead and the next run self-heals from it"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git push origin "HEAD:$branch"; then
            echo "::warning::could not push the version bump; the release below still goes ahead and the next run self-heals from it"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FULL_VERSION: ${{ steps.version.outputs.full }}
          APK: ${{ steps.apk.outputs.path }}
          CHECKSUM: ${{ steps.apk.outputs.checksum }}
          TARGET: ${{ steps.bump_commit.outputs.sha }}
        run: |
          # Defensive: the version step already picked a free tag, but a
          # concurrent run could have claimed it in the meantime.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing was published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Point the tag at the version-bump commit so the tagged tree builds
          # the exact version the release advertises.
          target="${TARGET:-$GITHUB_SHA}"

          cat > release-notes.md <<EOF
          ## APK de depuração

          Este APK é assinado com a chave de depuração estável do projeto e pode
          atualizar versões de depuração anteriores geradas por este workflow.

          **Versão:** $FULL_VERSION

          **Commit:** $target

          Na primeira migração de um APK de depuração assinado em outra máquina,
          o Android pode exigir a desinstalação da versão antiga. Exporte seus
          pacotes antes de desinstalar o app.
          EOF

          gh release create "$TAG" "$APK" "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target" \
            --title "Stickers $FULL_VERSION (debug)" \
            --latest \
            --generate-notes \
            --notes-file release-notes.md

          {
            echo "### GitHub Release publicada"
            echo "- Versão: \`$FULL_VERSION\`"
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$target\`"
            echo "- APK: \`$(basename "$APK")\`"
          } >> "$GITHUB_STEP_SUMMARY"
