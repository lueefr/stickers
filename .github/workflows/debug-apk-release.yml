name: Build, measure and publish optimized APKs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part to bump (auto = patch, rolling 9 over to the next minor)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: 'Explicit version name, e.g. 2.0.0 (overrides bump; must be newer)'
        type: string
        default: ''

# Publishing a GitHub Release requires write access to repository contents.
permissions:
  contents: write

concurrency:
  group: optimized-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, shrink and measure
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      apk-artifact: stickers-${{ steps.version.outputs.safe }}-release
    # Defense in depth: the version-bump commit pushed below (tagged [skip ci])
    # must never trigger another release run. Pushes made with GITHUB_TOKEN
    # already don't trigger workflows; this guard covers custom tokens too.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          pubspec=$(python3 tool/bump_version.py --pubspec)
          echo "pubspec.yaml: $pubspec"

          if [[ "$EVENT" == "pull_request" || "$REF" != "refs/heads/main" ]]; then
            # PR builds only validate the code; the version is assigned when
            # the change lands on main.
            next="$pubspec"
            bumped=false
          else
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [[ -n "$latest" ]] && python3 tool/bump_version.py --check "$latest"; then
              echo "latest release: $latest"
              base=$(python3 tool/bump_version.py --max "$pubspec" "$latest")
            else
              echo "no parseable previous release; basing the bump on pubspec.yaml"
              base="$pubspec"
            fi
            echo "base version: $base"

            args=(--plan --base "$base")
            [[ -n "$BUMP" ]] && args+=(--bump "$BUMP")
            [[ -n "$EXPLICIT" ]] && args+=(--explicit "$EXPLICIT")
            next=$(python3 tool/bump_version.py "${args[@]}")

            # A re-run must not reuse a tag: keep advancing while it exists.
            attempts=0
            while gh release view "v$next" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
              attempts=$((attempts + 1))
              if [[ "$attempts" -ge 50 ]]; then
                echo "::error::could not find a free release tag after 50 attempts"
                exit 1
              fi
              echo "tag v$next already exists; advancing once more"
              next=$(python3 tool/bump_version.py --next "$next")
            done

            python3 tool/bump_version.py --set-pubspec "$next"
            bumped=true
          fi

          name="${next%%+*}"
          build="${next##*+}"
          {
            echo "full=$next"
            echo "name=$name"
            echo "build=$build"
            echo "tag=v$next"
            echo "safe=${next//+/-}"
            echo "bumped=$bumped"
          } >> "$GITHUB_OUTPUT"
          echo "building version: $next (bumped: $bumped)"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Test build tooling
        run: python3 -m unittest discover -s tool -p 'test_*.py' -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        id: analyze
        # The tree is currently lint clean, but warnings and infos stay
        # non-fatal so a new lint introduced by a Flutter upgrade cannot block
        # a release build. Analyzer errors stay fatal, and the APK build below
        # compiles every source file as well.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          {
            echo '### Flutter analyze output'
            echo
            echo '```text'
            cat analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload analyzer diagnostics
        if: steps.analyze.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: flutter-analyze-diagnostics-${{ github.run_id }}
          path: analyze.log
          if-no-files-found: error
          retention-days: 7

      - name: Surface analyzer diagnostics
        if: steps.analyze.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The runner log is also uploaded above. Echo the first diagnostics
          # as annotations so they remain inspectable when a log download is
          # unavailable from a restricted network.
          for number, line in enumerate(Path('analyze.log').read_text().splitlines(), 1):
              if not line.strip():
                  continue
              message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error file=analyze.log,line={number}::{message}')
              if number >= 100:
                  break
          PY

      - name: Fail on analyzer errors
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: flutter test

      - name: Build optimized community APKs
        shell: bash
        env:
          ORG_GRADLE_PROJECT_communitySigning: 'true'
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -o pipefail
          args=(--release --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
                --split-debug-info=build/symbols)
          if [[ -n "$GOOGLE_FONTS_API_KEY" ]]; then
            args+=(--dart-define="GOOGLE_FONTS_API_KEY=$GOOGLE_FONTS_API_KEY")
          fi
          # AOT + R8 + resource/icon tree shaking. Every supported ABI still ships.
          flutter build apk "${args[@]}" --split-per-abi 2>&1 | tee build-apk.log
          mkdir -p build/apks
          cp build/app/outputs/flutter-apk/app-*-release.apk build/apks/
          # Compatibility fallback for old updaters and unknown device ABIs.
          flutter build apk "${args[@]}" 2>&1 | tee -a build-apk.log
          cp build/app/outputs/flutter-apk/app-release.apk build/apks/app-universal-release.apk

      - name: Surface build diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('build-apk.log')
          if p.exists():
              for line in p.read_text().splitlines()[-100:]:
                  message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error::{message}')
          PYCODE

      - name: Prepare and measure APKs
        id: apk
        shell: bash
        env:
          SAFE_VERSION: ${{ steps.version.outputs.safe }}
        run: |
          for apk in build/apks/app-*-release.apk; do
            suffix="${apk##*/app-}"
            dest="build/apks/stickers-${SAFE_VERSION}-${suffix}"
            mv "$apk" "$dest"
            (cd build/apks && sha256sum "$(basename "$dest")" > "$(basename "$dest").sha256")
          done
          python3 tool/apk_report.py build/apks/*.apk --output build/apk-report.json | tee -a "$GITHUB_STEP_SUMMARY"
          # Retain dependency resolution and tool versions for reproducibility.
          cp pubspec.lock build/pubspec.lock
          flutter --version > build/flutter-version.txt

      - name: Upload optimized APKs
        uses: actions/upload-artifact@v5
        with:
          name: stickers-${{ steps.version.outputs.safe }}-release
          path: build/apks/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics and symbols
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: performance-diagnostics-${{ github.run_id }}
          path: |
            analyze.log
            build-apk.log
            build/apk-report.json
            build/pubspec.lock
            build/flutter-version.txt
            build/symbols/
            build/app/outputs/mapping/release/
          retention-days: 30

      - name: Commit version bump
        id: bump_commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.version.outputs.bumped == 'true'
        shell: bash
        env:
          FULL_VERSION: ${{ steps.version.outputs.full }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          if git diff --cached --quiet; then
            echo "pubspec.yaml already up to date; nothing to commit"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: bump version to $FULL_VERSION [skip ci]"
          branch="${GITHUB_REF_NAME:?}"
          git fetch origin "$branch"
          # Flutter tooling can leave tracked generated files modified after
          # the version commit. Autostash those changes so a concurrent push
          # can still be rebased without failing with "cannot rebase: You
          # have unstaged changes".
          if ! git rebase --autostash "origin/$branch"; then
            git rebase --abort
            echo "::warning::could not rebase the version bump onto the latest $branch; the release below still goes ahead and the next run self-heals from it"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git push origin "HEAD:$branch"; then
            echo "::warning::could not push the version bump; the release below still goes ahead and the next run self-heals from it"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FULL_VERSION: ${{ steps.version.outputs.full }}
          TARGET: ${{ steps.bump_commit.outputs.sha }}
        run: |
          # Defensive: the version step already picked a free tag, but a
          # concurrent run could have claimed it in the meantime.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing was published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Point the tag at the version-bump commit so the tagged tree builds
          # the exact version the release advertises.
          target="${TARGET:-$GITHUB_SHA}"

          cat > release-notes.md <<EOF
          ## APKs otimizados (release/AOT)

          Compilação release/AOT, com R8 e recursos reduzidos. Todas as funções,
          fontes, traduções e animações são mantidas. Escolha arm64-v8a para a
          maioria dos celulares atuais, armeabi-v7a para ARM de 32 bits ou x86_64
          para dispositivos Intel/emuladores. Em dúvida, use universal.

          Assinado com a chave comunitária de depuração estável do projeto para
          atualizar os APKs anteriores sem apagar dados. É uma chave pública,
          não uma assinatura privada de produção.

          **Versão:** $FULL_VERSION

          **Commit:** $target

          Na primeira migração de um APK de depuração assinado em outra máquina,
          o Android pode exigir a desinstalação da versão antiga. Exporte seus
          pacotes antes de desinstalar o app.
          EOF

          gh release create "$TAG" build/apks/*.apk build/apks/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target" \
            --title "Stickers $FULL_VERSION" \
            --latest \
            --generate-notes \
            --notes-file release-notes.md

          {
            echo "### GitHub Release publicada"
            echo "- Versão: \`$FULL_VERSION\`"
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$target\`"
            echo "- APKs release por ABI + universal; tamanhos no relatório acima."
          } >> "$GITHUB_STEP_SUMMARY"

  startup-smoke:
    name: Cold-start smoke (release, Android 35)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.apk-artifact }}
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot and measure the actual release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tool/startup_smoke.py apks/*-x86_64-release.apk
      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: startup-evidence-${{ github.run_id }}
          path: build/startup/
          if-no-files-found: warn
          retention-days: 30
